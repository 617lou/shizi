<script>
var cur=null;
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(cur){cur.pause();}
  cur=new Audio(b.getAttribute('data-src'));
  cur.play();
  b.style.background='#38c172';
  setTimeout(function(){b.style.background='';},400);
});
</script>
