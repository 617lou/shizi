<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>快乐认字 · 听音找字</title>
<style>
:root{
  --ink:#43302b;
  --ink-soft:#8a7a6a;
  --gold:#ffc93c;
  --green:#38c172;
  --green-d:#2aa15c;
  --blue:#4aa8ff;
  --blue-d:#2f83d6;
  --gray:#c9d3dc;
  --gray-d:#a9b5c0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#bfe8ff 0%,#e6f6ff 45%,#fff7e3 100%);
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
button{font-family:inherit}

/* ---------- 背景 ---------- */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;height:42px;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56%;height:170%;left:12%;top:-92%}
.cloud::after{width:38%;height:140%;right:14%;top:-68%}
@keyframes drift{from{left:-48%}to{left:112%}}
.float{position:absolute;bottom:-20vh;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.28));
  animation:rise linear infinite}
@keyframes rise{0%{bottom:-20vh;opacity:0}12%{opacity:.85}88%{opacity:.85}100%{bottom:108vh;opacity:0}}
#fx{position:fixed;inset:0;z-index:20;pointer-events:none}

/* ---------- 屏幕 ---------- */
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  visibility:hidden;opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s ease;
  transform:scale(.985);
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.screen.active{visibility:visible;opacity:1;pointer-events:auto;transform:none}
.screen.center{justify-content:center;align-items:center;gap:clamp(6px,1.6vmin,16px);overflow-y:auto}

/* ---------- 首页 ---------- */
.logo{margin:0;font-size:clamp(32px,8.6vmin,62px);font-weight:900;letter-spacing:.04em;color:#fff;
  text-shadow:0 3px 0 #ffb703,0 6px 0 #e08e00,0 12px 20px rgba(60,90,120,.22);
  animation:bob 3s ease-in-out infinite}
.logo span{color:#fff3b0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sub{margin:0;font-size:clamp(14px,2.8vmin,20px);font-weight:700;color:#5f7f96;letter-spacing:.14em}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,2.2vmin,18px);
  width:min(560px,94vw);margin:clamp(12px,2.6vmin,26px) 0}
.level-card{--c:#ffd166;border:0;border-top:8px solid var(--c);border-radius:22px;
  background:#fff;padding:clamp(9px,2vmin,16px);cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:0 7px 0 rgba(90,120,150,.16),0 12px 22px rgba(90,120,150,.14);
  transition:transform .12s ease,box-shadow .12s ease}
.level-card:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(90,120,150,.16)}
.lv-head{display:flex;align-items:center;gap:8px}
.lv-no{width:1.75em;height:1.75em;flex:0 0 auto;border-radius:50%;background:var(--c);color:#fff;
  font-weight:900;font-size:clamp(13px,2.5vmin,17px);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.lv-name{font-size:clamp(12px,2.3vmin,16px);font-weight:800;color:var(--ink-soft)}
.lv-chars{display:flex;gap:.22em;flex-wrap:wrap;font-size:clamp(19px,4.2vmin,28px);font-weight:800;line-height:1.15}
.lv-stars{display:flex;gap:.1em;font-size:clamp(12px,2.4vmin,17px)}
.lv-stars span,.big-stars span{opacity:.18;filter:grayscale(1)}
.lv-stars span.on,.big-stars span.on{opacity:1;filter:none}
.stars-total{font-size:clamp(13px,2.6vmin,18px);font-weight:700;color:#5f7f96;background:rgba(255,255,255,.75);
  border-radius:999px;padding:.35em 1em;box-shadow:0 3px 0 rgba(90,120,150,.12)}
.stars-total b{color:#e08800}
.home-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:0;border-radius:999px;padding:.5em 1.1em;font-size:clamp(13px,2.5vmin,17px);font-weight:800;
  color:#4a6a80;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(90,120,150,.18);cursor:pointer}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip.off{color:#8a8f96;background:rgba(255,255,255,.6)}
.tip{max-width:min(560px,92vw);margin:0;text-align:center;font-size:clamp(11px,2.1vmin,14px);
  color:#7f8b96;line-height:1.6}

/* ---------- 游戏页 ---------- */
.hud{display:flex;align-items:center;gap:10px;flex:0 0 auto;height:clamp(36px,7vmin,50px)}
.icon-btn{width:clamp(36px,6.6vmin,48px);height:clamp(36px,6.6vmin,48px);border-radius:50%;border:0;
  background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(90,120,150,.18);cursor:pointer;
  font-size:clamp(17px,3.2vmin,22px);color:#7a8b99;line-height:1}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.spacer{flex:1}
.dots{display:flex;gap:clamp(6px,1.4vmin,10px);align-items:center}
.dot{width:clamp(12px,2.5vmin,18px);height:clamp(12px,2.5vmin,18px);border-radius:50%;background:#fff;
  box-shadow:inset 0 0 0 2px rgba(90,120,150,.12);transition:transform .2s,background .2s}
.dot.done{background:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.35);animation:pop .3s}
.level-tag{font-size:clamp(13px,2.5vmin,18px);font-weight:800;color:#8a9aa8}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.4vmin,22px);min-height:0}
.art-card{position:relative;border:0;background:rgba(255,255,255,.75);cursor:pointer;
  border-radius:clamp(20px,4vmin,36px);padding:clamp(10px,2.4vmin,22px) clamp(16px,3.4vmin,32px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vmin,12px);
  box-shadow:0 8px 0 rgba(255,255,255,.5),0 16px 32px rgba(80,120,160,.18)}
.art-card.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.art-emoji{display:flex;flex-direction:column;align-items:center;font-size:clamp(58px,23vmin,170px);line-height:1.05}
.art-emoji.stacked .st{font-size:.68em;line-height:1.05}
.art-emoji.stacked .st:first-child{animation:bob 2.4s ease-in-out infinite}
.speak-btn{border:0;border-radius:999px;background:var(--blue);color:#fff;cursor:pointer;
  font-size:clamp(14px,2.6vmin,19px);font-weight:800;padding:.45em 1.1em;
  display:flex;align-items:center;gap:.4em;box-shadow:0 5px 0 var(--blue-d)}
.speak-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.cue{max-width:92vw;text-align:center;font-size:clamp(13px,2.5vmin,18px);font-weight:800;color:#b26a00;
  background:#fff6d9;border-radius:14px;padding:.4em .9em;display:none}
.cue.show{display:block}

.options{display:flex;gap:clamp(10px,2.2vmin,22px);justify-content:center;align-items:center;width:100%;max-width:760px}
.opt{flex:1 1 0;max-width:min(33vw,230px);aspect-ratio:3/4;border:0;border-radius:clamp(16px,3.2vmin,28px);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 0 rgba(90,120,150,.2),0 14px 26px rgba(90,120,150,.16);
  transition:transform .14s ease,box-shadow .14s ease,opacity .3s ease}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(90,120,150,.2)}
.opt .ch{font-size:clamp(44px,14vmin,124px);font-weight:800;line-height:1;color:var(--ink)}
.opt.right{background:#eafff1;transform:translateY(-6px) scale(1.06);
  box-shadow:0 0 0 6px var(--green),0 8px 0 var(--green-d)}
.opt.right .ch{color:var(--green-d)}
.opt.dim{opacity:.3;filter:grayscale(.7)}
.opt.used{opacity:.22;pointer-events:none}
.opt.wrong{background:#fff1f1;animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opt.hint{box-shadow:0 0 0 6px rgba(74,168,255,.8),0 8px 0 rgba(90,120,150,.2);animation:hint 1.1s ease-in-out infinite}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* ---------- 过关页 ---------- */
.done-title{margin:0;font-size:clamp(26px,6.4vmin,50px);font-weight:900;color:#fff;
  text-shadow:0 3px 0 #ffb703,0 6px 0 #e08e00,0 10px 18px rgba(60,90,120,.2)}
.big-stars{display:flex;gap:.08em;font-size:clamp(34px,8.6vmin,70px)}
.big-stars span.on{animation:pop .55s cubic-bezier(.2,1.7,.4,1) both}
.done-msg{margin:0;font-size:clamp(14px,2.8vmin,20px);font-weight:800;color:#5f7f96}
.review{display:flex;gap:clamp(6px,1.5vmin,14px);flex-wrap:wrap;justify-content:center;max-width:min(620px,94vw)}
.review button{border:0;border-radius:18px;background:#fff;cursor:pointer;
  padding:clamp(6px,1.3vmin,12px) clamp(8px,1.8vmin,16px);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 5px 0 rgba(90,120,150,.18);transition:transform .15s ease,box-shadow .15s ease}
.review button:active{transform:translateY(4px);box-shadow:none}
.review button.speaking{box-shadow:0 0 0 5px rgba(255,201,60,.9),0 5px 0 rgba(90,120,150,.18);transform:translateY(-4px)}
.r-art{font-size:clamp(19px,4.2vmin,30px);line-height:1.1}
.r-ch{font-size:clamp(26px,5.6vmin,42px);font-weight:800;line-height:1}
.r-py{font-size:clamp(11px,2.1vmin,15px);color:var(--ink-soft);font-weight:700}
.done-btns{display:flex;gap:clamp(8px,1.8vmin,16px);flex-wrap:wrap;justify-content:center;margin-top:clamp(6px,1.4vmin,14px)}

/* ---------- 按钮 / 弹窗 / 气泡 ---------- */
.btn{border:0;border-radius:18px;padding:.5em 1.1em;font-size:clamp(15px,3vmin,21px);font-weight:800;
  color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 5px 0 var(--blue-d)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.gray{background:var(--gray);color:#4a565e;box-shadow:0 5px 0 var(--gray-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.gold{background:#ffb703;color:#4a3a12;box-shadow:0 5px 0 #d99400}
#confirm{position:fixed;inset:0;z-index:40;background:rgba(40,55,70,.45);
  display:none;align-items:center;justify-content:center;padding:20px}
#confirm.show{display:flex}
.dialog{background:#fff;border-radius:26px;padding:clamp(16px,3.2vmin,28px);max-width:430px;
  box-shadow:0 22px 50px rgba(0,0,0,.28)}
.dialog p{margin:0 0 clamp(14px,2.6vmin,22px);font-size:clamp(16px,3.2vmin,23px);font-weight:800;text-align:center;line-height:1.5}
.dialog .row{display:flex;gap:12px}
.bubble{position:fixed;z-index:30;left:50%;top:13%;transform:translate(-50%,-50%) scale(.6);opacity:0;
  pointer-events:none;background:#fff;border-radius:24px;padding:.55em 1.05em;
  font-size:clamp(19px,4.2vmin,32px);font-weight:800;white-space:nowrap;
  box-shadow:0 14px 32px rgba(0,0,0,.2);
  transition:opacity .2s ease,transform .26s cubic-bezier(.2,1.6,.4,1)}
.bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bubble.good{color:var(--green-d);box-shadow:0 0 0 6px rgba(56,193,114,.3),0 14px 32px rgba(0,0,0,.2)}
.bubble.good i{font-style:normal;font-size:.72em;color:#8a9aa8}
.bubble.bad{color:#d9532f;box-shadow:0 0 0 6px rgba(255,150,120,.3),0 14px 32px rgba(0,0,0,.2)}

/* ---------- 横屏 / 矮屏适配 ---------- */
@media (min-aspect-ratio:5/4){
  .stage{flex-direction:row;gap:clamp(16px,3vmin,44px)}
  .art-card{flex:0 0 auto}
  .options{flex:1 1 auto;max-width:none}
  .opt{max-width:min(22vw,200px)}
  .cue{position:absolute;bottom:10px;left:50%;transform:translateX(-50%)}
}
@media (max-height:540px){
  .logo{font-size:clamp(20px,5.4vmin,32px)}
  .sub{display:none}
  .levels{margin:8px 0;gap:8px}
  .tip{display:none}
  .stars-total{font-size:12px;padding:.2em .8em}
  .art-emoji{font-size:clamp(44px,17vmin,110px)}
  .big-stars{font-size:clamp(24px,7vmin,44px)}
}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<canvas id="fx"></canvas>

<section class="screen center active" id="home">
  <h1 class="logo">快乐<span>认字</span></h1>
  <p class="sub">听一听 · 找一找 · 认汉字</p>
  <div class="levels" id="levelGrid"></div>
  <div class="stars-total" id="totalStars"></div>
  <div class="home-foot">
    <button class="chip" id="soundToggle">🔊 声音开着</button>
    <button class="chip" id="resetBtn">↺ 重新开始</button>
  </div>
  <p class="tip">答错了没关系，点图片就能再听一遍。建议家长陪孩子一起玩。</p>
</section>

<section class="screen" id="play">
  <header class="hud">
    <button class="icon-btn" id="backBtn" aria-label="返回首页">←</button>
    <div class="dots" id="dots"></div>
    <span class="spacer"></span>
    <span class="level-tag" id="levelTag"></span>
  </header>
  <div class="stage">
    <div class="art-card" id="artCard" role="button" tabindex="0" aria-label="再听一遍">
      <div class="art-emoji" id="artEmoji">🧒</div>
      <button class="speak-btn" id="speakBtn"><span>🔊</span><span>再听一遍</span></button>
    </div>
    <div class="cue" id="parentCue"></div>
    <div class="options" id="options"></div>
  </div>
</section>

<section class="screen center" id="done">
  <h2 class="done-title" id="doneTitle">真棒！</h2>
  <div class="big-stars" id="bigStars"></div>
  <p class="done-msg" id="doneMsg"></p>
  <div class="review" id="reviewList"></div>
  <div class="done-btns">
    <button class="btn gold" id="againBtn">再玩一次</button>
    <button class="btn green" id="nextBtn">下一关</button>
    <button class="btn gray" id="homeBtn">回首页</button>
  </div>
</section>

<div class="bubble" id="bubble"></div>

<div id="confirm">
  <div class="dialog">
    <p id="confirmMsg">要回首页吗？</p>
    <div class="row">
      <button class="btn gray" id="noBtn">再玩一会</button>
      <button class="btn" id="yesBtn">确定</button>
    </div>
  </div>

<script>
(function(){

var CHARS = {

var LEVELS = [
  { name:'第一关', chars:['一','二','三','人','口'], choices:2, color:'#ffd166' },
  { name:'第二关', chars:['手','大','小','上','下'], choices:2, color:'#8ecae6' },

var shuffle = function(src){
  var a = src.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
};

var K_PROG = 'shizi.v1.progress', K_SOUND = 'shizi.v1.sound';

try { soundOn = localStorage.getItem(K_SOUND) !== '0'; } catch (e) {}
function saveProgress(){ try { localStorage.setItem(K_PROG, JSON.stringify(progress)); } catch (e) {} }
function saveSound(){ try { localStorage.setItem(K_SOUND, soundOn ? '1' : '0'); } catch (e) {} }

/* ---------- 音效（现场合成，不需要音频文件） ---------- */
var Sfx = {
  ctx: null,
  ensure: function(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    return this.ctx;
  },
  tone: function(freq, at, dur, type, vol){
    if (!soundOn) return;
    var ctx = this.ensure(); if (!ctx) return;
    var t0 = ctx.currentTime + at;
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  tap: function(){ this.tone(880, 0, 0.07, 'square', 0.05); },
  pop: function(){ this.tone(1200, 0, 0.09, 'sine', 0.1); },
  right: function(){
    this.tone(659.25, 0, 0.3); this.tone(783.99, 0.1, 0.3); this.tone(1046.5, 0.2, 0.34);
  },
  wrong: function(){
    this.tone(330, 0, 0.16, 'sine', 0.09); this.tone(262, 0.13, 0.26, 'sine', 0.08);
  },
  win: function(){
    var self = this, seq = [[523.25, 0], [659.25, 0.13], [783.99, 0.26], [1046.5, 0.39], [1318.5, 0.55]];
    seq.forEach(function(n){ self.tone(n[0], n[1], 0.5); });
  }
};

/* ---------- 语音朗读 ---------- */
var TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [], voice: null, unlocked: false,
  init: function(){
    if (!this.ok) return;
    var self = this;
    var pick = function(){
      self.voices = window.speechSynthesis.getVoices() || [];
      var zh = self.voices.filter(function(v){ return /^zh/i.test(v.lang || ''); });
      zh.sort(function(a, b){
        var sa = /CN|Hans|SG/i.test(a.lang) ? 0 : 1;
        var sb = /CN|Hans|SG/i.test(b.lang) ? 0 : 1;
        return sa - sb;
      });
      self.voice = zh[0] || null;
      updateCue();
    };
    pick();
    if (typeof window.speechSynthesis.addEventListener === 'function'){
      window.speechSynthesis.addEventListener('voiceschanged', pick);
    } else {
      window.speechSynthesis.onvoiceschanged = pick;
    }
  },
  unlock: function(){
    if (!this.ok || this.unlocked) return;
    this.unlocked = true;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.lang = 'zh-CN';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  },
  say: function(text, opt){
    if (!this.ok || !soundOn || !text) return;
    opt = opt || {};
    var self = this;
    var rate = opt.rate || 0.9, pitch = opt.pitch || 1.12;
    setTimeout(function(){
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = rate; u.pitch = pitch; u.volume = 1;
        if (self.voice) u.voice = self.voice;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }, 45);
  },
  stop: function(){ if (this.ok) { try { window.speechSynthesis.cancel(); } catch (e) {} } }
};

/* ---------- 语音播放：优先播 audio/ 里的生成语音，缺失或播放失败就回退系统 TTS ---------- */
var SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
var Voice = {
  cache: {}, broken: {}, last: null, unlocked: false,
  url: function(key){ return VOICE_DATA[key] || (VOICE_DIR + key + '.mp3'); },
  el: function(key){
    if (this.broken[key]) return null;
    if (!this.cache[key]){
      var self = this, a = new Audio();
      a.preload = 'auto';
      a.src = this.url(key);
      a.addEventListener('error', function(){ self.broken[key] = true; updateCue(); });
      this.cache[key] = a;
    }
    return this.cache[key];
  },
  canPlay: function(key){ return !this.broken[key]; },
  preload: function(keys){
    for (var i = 0; i < keys.length; i++) this.el(keys[i]);
  },
  stop: function(){
    if (this.last){ try { this.last.pause(); this.last.currentTime = 0; } catch (e) {} this.last = null; }
    TTS.stop();
  },
  say: function(key, fallbackText, opt){
    this.stop();
    var self = this, a = this.el(key);
    if (!a){ TTS.say(fallbackText, opt); updateCue(); return; }
    var p;
    try { p = a.play(); } catch (e) { p = null; this.broken[key] = true; }
    this.last = a;
    if (p && p.catch){
      p.catch(function(err){
        // 只是还没解锁（浏览器要求先有一次点击）就别永久标记，等下次再试
        if (!err || err.name !== 'NotAllowedError') self.broken[key] = true;
        TTS.say(fallbackText, opt);
        updateCue();
      });
    }
  },
  // 首次点击时解锁音频播放（iOS 要求第一次播放发生在用户手势里）
  unlock: function(){
    if (this.unlocked) return;
    this.unlocked = true;
    try { var a = new Audio(SILENT_WAV); a.volume = 0; a.play(); } catch (e) {}
  }
};

/* ---------- 粒子特效 ---------- */
var FX = {
  cv: null, cx: null, parts: [], raf: 0, w: 0, h: 0, dpr: 1,
  glyphs: ['⭐', '✨', '🌟', '💛', '🎉', '🎈', '🌈', '🍭'],
  cols: ['#ffd166', '#ff8fab', '#8ecae6', '#a6e0a0', '#ffb703', '#c792ea'],
  init: function(){
    this.cv = $('fx');
    this.cx = this.cv.getContext('2d');
    this.resize();
    var self = this;
    window.addEventListener('resize', function(){ self.resize(); });
  },
  resize: function(){
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.cv.width = Math.floor(this.w * this.dpr);
    this.cv.height = Math.floor(this.h * this.dpr);
    this.cv.style.width = this.w + 'px';
    this.cv.style.height = this.h + 'px';
    this.cx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },
  add: function(x, y, vx, vy){
    var emoji = Math.random() < 0.72;
    this.parts.push({
      x: x, y: y, vx: vx, vy: vy, g: 0.32, life: 1,
      decay: 0.006 + Math.random() * 0.006,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.28,
      size: 16 + Math.random() * 18, emoji: emoji,
      glyph: this.glyphs[(Math.random() * this.glyphs.length) | 0],
      col: this.cols[(Math.random() * this.cols.length) | 0]
    });
  },
  burstAt: function(el, n){
    var r = el.getBoundingClientRect();
    var cx0 = r.left + r.width / 2, cy0 = r.top + r.height / 2;
    for (var i = 0; i < (n || 18); i++){
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      this.add(cx0, cy0, Math.cos(a) * sp, Math.sin(a) * sp - 3.2);
    }
    this.run();
  },
  rain: function(n){
    for (var i = 0; i < (n || 100); i++){
      this.add(Math.random() * this.w, -30 - Math.random() * this.h * 0.7,
        (Math.random() - 0.5) * 1.2, 1.5 + Math.random() * 3);
    }
    this.run();
  },
  run: function(){
    if (this.raf) return;
    var self = this;
    this.raf = requestAnimationFrame(function(){ self.tick(); });
  },
  tick: function(){
    var cx = this.cx;
    cx.clearRect(0, 0, this.w, this.h);
    var alive = [];
    for (var i = 0; i < this.parts.length; i++){
      var p = this.parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= 0.995;
      p.rot += p.vr; p.life -= p.decay;
      if (p.life > 0 && p.y < this.h + 80){
        alive.push(p);
        cx.save();
        cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
        cx.translate(p.x, p.y); cx.rotate(p.rot);
        if (p.emoji){
          cx.font = p.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
          cx.textAlign = 'center'; cx.textBaseline = 'middle';
          cx.fillText(p.glyph, 0, 0);
        } else {
          cx.fillStyle = p.col;
          cx.fillRect(-p.size * 0.28, -p.size * 0.18, p.size * 0.56, p.size * 0.36);
        }
        cx.restore();
      }
    }
    this.parts = alive;
    var self = this;
    if (alive.length){
      this.raf = requestAnimationFrame(function(){ self.tick(); });
    } else {
      this.raf = 0;
      cx.clearRect(0, 0, this.w, this.h);
    }
  }
};

/* ---------- 背景装饰 ---------- */
function buildSky(){
  var sky = $('sky');
  var clouds = [[7, 150, 3.4, 0], [58, 135, 4.6, -1.4], [26, 105, 5.6, -2.6]];
  clouds.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'cloud';
    d.style.top = c[0] + '%';
    d.style.width = c[1] + 'px';
    d.style.animationDuration = c[2] + 's';
    d.style.animationDelay = c[3] + 's';
    sky.appendChild(d);
  });
  for (var i = 0; i < 12; i++){
    var b = document.createElement('div');
    var s = 12 + Math.random() * 42;
    b.className = 'float';
    b.style.width = s + 'px';
    b.style.height = s + 'px';
    b.style.left = (Math.random() * 94) + '%';
    b.style.animationDuration = (12 + Math.random() * 14) + 's';
    b.style.animationDelay = (-Math.random() * 20) + 's';
    sky.appendChild(b);
  }
}

/* ---------- 游戏状态 ---------- */
var G = { lv: 0, queue: [], idx: 0, target: '', wrongs: 0, locked: false, mistakes: 0, timers: [] };
function later(fn, ms){ var t = setTimeout(fn, ms); G.timers.push(t); return t; }
function clearLater(){ G.timers.forEach(clearTimeout); G.timers = []; }
function showScreen(id){
  var list = document.querySelectorAll('.screen');
  for (var i = 0; i < list.length; i++){
    list[i].classList.toggle('active', list[i].id === id);
  }
}

/* ---------- 画面渲染 ---------- */
function updateCue(){
  var el = $('parentCue');
  if (!G.target || !$('play').classList.contains('active')){
    el.classList.remove('show');
    el.textContent = '';
    return;
  }
  // 有语音文件就一定有声音；文件缺失时才看设备的 TTS 能不能用
  var ttsUsable = TTS.ok && !(TTS.voices.length > 0 && !TTS.voice);
  var heard = soundOn && (Voice.canPlay('zi/' + CHARS[G.target].id) || ttsUsable);
  if (heard){
    el.classList.remove('show');
    el.textContent = '';
    return;
  }
  el.textContent = '请家长念：' + G.target + '（' + CHARS[G.target].pinyin + '）';
  el.classList.add('show');
}
function setArt(ch){
  var d = CHARS[ch], box = $('artEmoji');
  if (d.stack){
    box.className = 'art-emoji stacked';
    box.innerHTML = '<span class="st">' + d.stack[0] + '</span><span class="st">' + d.stack[1] + '</span>';
  } else {
    box.className = 'art-emoji';
    box.textContent = d.art;
  }
  var card = $('artCard');
  card.classList.remove('pop');
  void card.offsetWidth;
  card.classList.add('pop');
}
function renderDots(){
  var n = LEVELS[G.lv].chars.length, box = $('dots');
  box.innerHTML = '';
  for (var i = 0; i < n; i++){
    var d = document.createElement('span');
    d.className = 'dot' + (i < G.idx ? ' done' : '');
    box.appendChild(d);
  }
}
function markDot(i){
  var list = $('dots').querySelectorAll('.dot');
  if (list[i]) list[i].classList.add('done');
}
var bubbleTimer = null;
function bubble(html, kind){
  var b = $('bubble');
  b.className = 'bubble';
  b.innerHTML = html;
  void b.offsetWidth;
  b.className = 'bubble ' + (kind || 'good') + ' show';
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(function(){ b.classList.remove('show'); }, 1500);
}

/* ---------- 出题 ---------- */
function levelVoiceKeys(i){
  var keys = ['ui/lv' + (i + 1)];
  LEVELS[i].chars.forEach(function(c){
    keys.push('zi/' + CHARS[c].id);
    keys.push('ph/right-' + CHARS[c].id);
  });
  return keys;
}
function speakTarget(){
  if (!G.target) return;
  Voice.say('zi/' + CHARS[G.target].id, G.target, { rate: 0.9, pitch: 1.0 });
}
function startLevel(i){
  G.lv = i;
  G.queue = shuffle(LEVELS[i].chars);
  G.idx = 0;
  G.mistakes = 0;
  G.target = G.queue[0];
  G.wrongs = 0;
  G.locked = false;
  clearLater();
  $('levelTag').textContent = LEVELS[i].name;
  setArt(G.target);
  renderDots();
  showScreen('play');
  Voice.preload(levelVoiceKeys(i));
  Voice.say('ui/lv' + (i + 1), LEVELS[i].name, { rate: 0.95, pitch: 1.0 });
  later(nextQuestion, 1700);   // 等「第一关」念完（约 1.4s）再出第一题
}
function nextQuestion(){
  clearLater();
  if (G.idx >= G.queue.length) { levelDone(); return; }
  G.locked = false; G.wrongs = 0;
  G.target = G.queue[G.idx];
  setArt(G.target);
  renderDots();
  updateCue();

  var lv = LEVELS[G.lv], target = G.target;
  var same = lv.chars.filter(function(c){ return c !== target; });
  var other = Object.keys(CHARS).filter(function(c){
    return c !== target && same.indexOf(c) < 0;
  });
  var pool = shuffle(same).concat(shuffle(other)).slice(0, lv.choices - 1);
  var opts = shuffle([target].concat(pool));

  var box = $('options');
  box.innerHTML = '';
  opts.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'opt';
    b.setAttribute('data-char', c);
    b.innerHTML = '<span class="ch">' + c + '</span>';
    b.addEventListener('click', function(){ choose(c, b); });
    box.appendChild(b);
  });

  speakTarget();
  later(function(){ if (!G.locked) speakTarget(); }, 4200);
  later(function(){ if (!G.locked) speakTarget(); }, 8800);
}
function choose(c, el){
  if (G.locked || el.classList.contains('used')) return;
  if (c === G.target) onRight(el); else onWrong(el);
}
function onRight(el){
  G.locked = true;
  clearLater();
  el.classList.remove('hint');
  el.classList.add('right');
  var all = $('options').querySelectorAll('.opt');
  for (var i = 0; i < all.length; i++){ if (all[i] !== el) all[i].classList.add('dim'); }
  markDot(G.idx);
  Sfx.right();
  FX.burstAt(el, 20);
  bubble('对啦！这是 ' + G.target + ' <i>' + CHARS[G.target].pinyin + '</i>', 'good');
  Voice.say('ph/right-' + CHARS[G.target].id, '对啦，这是' + G.target, { rate: 0.95, pitch: 1.0 });
  later(function(){ G.idx++; nextQuestion(); }, 2600);   // 等「对啦，这是X」念完（约 2.3s）
}
function onWrong(el){
  G.wrongs++;
  G.mistakes++;
  el.classList.add('wrong');
  setTimeout(function(){ el.classList.remove('wrong'); }, 460);
  setTimeout(function(){ el.classList.add('used'); }, 460);
  Sfx.wrong();
  bubble('再试一次吧', 'bad');
  Voice.say('ui/try', '再试一次吧', { rate: 0.95, pitch: 1.0 });
  if (G.wrongs >= 2){
    var all = $('options').querySelectorAll('.opt');
    for (var i = 0; i < all.length; i++){
      if (all[i].getAttribute('data-char') === G.target) all[i].classList.add('hint');
    }
  }
  later(function(){ if (!G.locked) speakTarget(); }, 2100);   // 等「再试一次吧」（约 1.7s）念完
}

/* ---------- 过关 ---------- */
function markSpeaking(el){
  var all = $('reviewList').querySelectorAll('button');
  for (var i = 0; i < all.length; i++){ all[i].classList.toggle('speaking', all[i] === el); }
}
function reviewSpeech(i){
  var list = $('reviewList').querySelectorAll('button');
  if (i >= list.length) return;
  var ch = LEVELS[G.lv].chars[i];
  markSpeaking(list[i]);
  Voice.say('zi/' + CHARS[ch].id, ch, { rate: 0.9, pitch: 1.0 });
  later(function(){ reviewSpeech(i + 1); }, 1700);
}
function levelDone(){
  clearLater();
  Voice.stop();
  var stars = G.mistakes === 0 ? 3 : (G.mistakes <= 3 ? 2 : 1);
  if ((progress[G.lv] || 0) < stars) progress[G.lv] = stars;
  saveProgress();

  var allDone = true;
  for (var i = 0; i < LEVELS.length; i++){ if (!progress[i]) allDone = false; }
  $('doneTitle').textContent = allDone ? '全部学完啦！' : '真棒！';
  $('doneMsg').textContent = allDone
    ? '四个关卡都完成了，你是认字小达人！'
    : LEVELS[G.lv].name + ' 完成';

  var bs = $('bigStars'), html = '';
  for (var k = 0; k < 3; k++){ html += '<span' + (k < stars ? ' class="on"' : '') + '>⭐</span>'; }
  bs.innerHTML = html;
  var on = bs.querySelectorAll('span.on');
  for (var m = 0; m < on.length; m++){ on[m].style.animationDelay = (0.15 + m * 0.18) + 's'; }

  var rl = $('reviewList');
  rl.innerHTML = '';
  LEVELS[G.lv].chars.forEach(function(ch){
    var b = document.createElement('button');
    var d = CHARS[ch];
    b.innerHTML = '<span class="r-art">' + (d.stack ? d.stack[1] : d.art) + '</span>'
      + '<span class="r-ch">' + ch + '</span>'
      + '<span class="r-py">' + d.pinyin + '</span>';
    b.addEventListener('click', function(){
      Sfx.pop();
      markSpeaking(b);
      Voice.say('zi/' + CHARS[ch].id, ch, { rate: 0.9, pitch: 1.0 });
    });
    rl.appendChild(b);
  });

  $('nextBtn').style.display = (G.lv < LEVELS.length - 1) ? '' : 'none';
  showScreen('done');
  Sfx.win();
  FX.rain(110);
  Voice.say(allDone ? 'ui/alldone' : 'ui/done',
    allDone ? '全部学完啦！你是认字小达人！' : '真棒！',
    { rate: 0.95, pitch: 1.0 });
  later(function(){ reviewSpeech(0); }, allDone ? 3900 : 1900);
}

/* ---------- 首页 ---------- */
function renderHome(){
  var grid = $('levelGrid');
  grid.innerHTML = '';
  var total = 0;
  LEVELS.forEach(function(lv, i){
    var st = progress[i] || 0;
    total += st;
    var b = document.createElement('button');
    b.className = 'level-card';
    b.style.setProperty('--c', lv.color);
    var starsHtml = '';
    for (var k = 0; k < 3; k++){ starsHtml += '<span' + (k < st ? ' class="on"' : '') + '>⭐</span>'; }
    b.innerHTML = '<div class="lv-head"><span class="lv-no">' + (i + 1) + '</span>'
      + '<span class="lv-name">' + lv.name + '</span></div>'
      + '<div class="lv-chars">' + lv.chars.map(function(c){ return '<span>' + c + '</span>'; }).join('') + '</div>'
      + '<div class="lv-stars">' + starsHtml + '</div>';
    b.addEventListener('click', function(){
      Sfx.tap();
      startLevel(i);
    });
    grid.appendChild(b);
  });
  $('totalStars').innerHTML = '已经收集 <b>' + total + '</b> / ' + (LEVELS.length * 3) + ' 颗星 ⭐';
}
function renderSound(){
  var b = $('soundToggle');
  b.textContent = soundOn ? '🔊 声音开着' : '🔇 静音中';
  b.classList.toggle('off', !soundOn);
}
function goHome(){
  clearLater();
  Voice.stop();
  G.target = '';
  renderHome();
  showScreen('home');
  updateCue();
}

/* ---------- 弹窗 ---------- */
var confirmCb = null;
function ask(msg, cb){
  $('confirmMsg').textContent = msg;
  confirmCb = cb;
  $('confirm').classList.add('show');
}
function closeAsk(){
  $('confirm').classList.remove('show');
  confirmCb = null;
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('pointerdown', function(){
  Sfx.ensure();
  TTS.unlock();
  Voice.unlock();
}, { once: true });

$('artCard').addEventListener('click', function(){
  Sfx.tap();
  speakTarget();
});
$('backBtn').addEventListener('click', function(){
  Sfx.tap();
  ask('要回首页吗？', goHome);
});
$('soundToggle').addEventListener('click', function(){
  soundOn = !soundOn;
  saveSound();
  renderSound();
  if (soundOn){ Sfx.tap(); Voice.say('ui/soundon', '声音打开了', { rate: 0.95, pitch: 1.0 }); } else { Voice.stop(); }
  updateCue();
});
$('resetBtn').addEventListener('click', function(){
  Sfx.tap();
  ask('要把星星清零，重新开始吗？', function(){
    progress = {};
    saveProgress();
    renderHome();
  });
});
$('yesBtn').addEventListener('click', function(){
  var cb = confirmCb;
  closeAsk();
  Sfx.tap();
  if (cb) cb();
});
$('noBtn').addEventListener('click', function(){
  closeAsk();
  Sfx.tap();
});
$('againBtn').addEventListener('click', function(){ Sfx.tap(); startLevel(G.lv); });
$('nextBtn').addEventListener('click', function(){ Sfx.tap(); startLevel(Math.min(G.lv + 1, LEVELS.length - 1)); });
$('homeBtn').addEventListener('click', function(){ Sfx.tap(); goHome(); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ clearLater(); Voice.stop(); }
});

/* ---------- 启动 ---------- */
buildSky();
FX.init();
TTS.init();
renderSound();
renderHome();
})();
</script>
</body>
</html>
